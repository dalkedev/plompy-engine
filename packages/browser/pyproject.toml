[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "szpont-browser"
version = "0.11.0"
description = "Persistent Camoufox browser tools over local MCP stdio"
requires-python = ">=3.12,<3.15"
dependencies = ["camoufox==0.5.9", "mcp==2.3.0"]

[project.scripts]
szpont-browser = "szpont_browser.server:main"

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "hatchling==1.33.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["src/szpont_browser"]
