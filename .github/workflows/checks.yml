name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine / Node 26.13.0 LTS
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Linux runtime dependency for Node 26
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libatomic1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - name: Install locked engine dependencies
        run: npm --prefix apps/discord-agent ci --ignore-scripts --no-audit --no-fund
      - name: Build and test the engine
        run: npm test
      - name: Verify intentionally permissive fixtures under a private umask
        run: |
          umask 0077
          node --test scripts/integrations-mcp.test.mjs scripts/state-snapshot.test.mjs

  provider-tools:
    name: Provider tools / MCP and Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libatomic1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - name: Keep the pinned Node executable outside the writable hosted tool cache
        run: |
          runtime_dir=$(sudo mktemp -d /tmp/szpont-ci-node-XXXXXX)
          sudo chmod 0755 "$runtime_dir"
          sudo install -m 0755 -o root -g root "$(command -v node)" "$runtime_dir/node"
          cmp "$(command -v node)" "$runtime_dir/node"
          printf '%s\n' "$runtime_dir" >> "$GITHUB_PATH"
      - name: Install locked optional tools
        run: |
          npm ci --prefix packages/mcp-bridge --ignore-scripts --no-audit --no-fund
          npm ci --prefix packages/playwright --ignore-scripts --no-audit --no-fund
      - name: Test MCP transport and credential boundaries offline
        run: npm test --prefix packages/mcp-bridge
      - name: Test isolated browser provisioning
        run: node --test packages/playwright/*.test.mjs
      - name: Verify executable ownership across distinct user IDs
        run: sudo "$(command -v node)" --test packages/playwright/runtime.test.mjs
      - name: Install pinned Chromium and Linux dependencies
        run: |
          ./packages/playwright/node_modules/.bin/playwright install-deps chromium
          node packages/playwright/install-browser.mjs --cache-dir "$RUNNER_TEMP/szpont-playwright-cache"
      - name: Allow only the provisioned Chromium sandbox on restricted Ubuntu hosts
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || true)" = 1 ]; then
            node packages/playwright/apparmor-profile.mjs --cache-dir "$RUNNER_TEMP/szpont-playwright-cache" > "$RUNNER_TEMP/szpont-playwright.apparmor"
            sudo install -m 0644 "$RUNNER_TEMP/szpont-playwright.apparmor" /etc/apparmor.d/szpont-playwright-ci
            sudo apparmor_parser -r -W /etc/apparmor.d/szpont-playwright-ci
          fi
      - name: Click through a synthetic local page over real MCP
        env:
          SZPONT_PLAYWRIGHT_SMOKE_CACHE: ${{ runner.temp }}/szpont-playwright-cache
        run: npm run smoke --prefix packages/playwright

  browser:
    name: Browser / Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/browser
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install hash-locked browser test dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation .
      - name: Test browser safety and provisioning offline
        run: python -m pytest -q

  public-tree:
    name: Public repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Linux runtime dependency for Node 26
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libatomic1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - name: Reject tracked private runtime state
        run: node .github/scripts/check-public-tree.mjs

  container:
    name: Container / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Load the container sandbox profile on this ephemeral runner
        run: |
          if docker info --format '{{json .SecurityOptions}}' | grep -q 'name=apparmor'; then
            sudo install -m 0644 scripts/docker-apparmor /etc/apparmor.d/szpont-engine-container
            sudo apparmor_parser -r -W /etc/apparmor.d/szpont-engine-container
            printf 'SZPONT_DOCKER_APPARMOR_PROFILE=szpont-engine-container\n' >> "$GITHUB_ENV"
          fi
      - name: Build without registry credentials
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          platforms: linux/${{ matrix.arch }}
          tags: szpont-engine:ci
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=checks-container-${{ matrix.arch }}
          cache-to: type=gha,scope=checks-container-${{ matrix.arch }},mode=max
      - name: Test the real Codex sandbox and isolated persistent state offline
        run: sh scripts/docker-smoke.sh szpont-engine:ci
