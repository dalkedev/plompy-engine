name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine / Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked engine dependencies
        run: npm --prefix apps/discord-agent ci --ignore-scripts --no-audit --no-fund
      - name: Build and test the engine
        run: npm test

  browser:
    name: Browser / Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/browser
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install hash-locked browser test dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation .
      - name: Test browser safety and provisioning offline
        run: python -m pytest -q

  public-tree:
    name: Public repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Reject tracked private runtime state
        run: node .github/scripts/check-public-tree.mjs

  container:
    name: Container / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Load the container sandbox profile on this ephemeral runner
        run: |
          if docker info --format '{{json .SecurityOptions}}' | grep -q 'name=apparmor'; then
            sudo install -m 0644 scripts/docker-apparmor /etc/apparmor.d/szpont-engine-container
            sudo apparmor_parser -r -W /etc/apparmor.d/szpont-engine-container
            printf 'SZPONT_DOCKER_APPARMOR_PROFILE=szpont-engine-container\n' >> "$GITHUB_ENV"
          fi
      - name: Build without registry credentials
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          platforms: linux/${{ matrix.arch }}
          tags: szpont-engine:ci
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=checks-container-${{ matrix.arch }}
          cache-to: type=gha,scope=checks-container-${{ matrix.arch }},mode=max
      - name: Test the real Codex sandbox and isolated persistent state offline
        run: sh scripts/docker-smoke.sh szpont-engine:ci
