name: Release container

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify tagged source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      image: ${{ steps.metadata.outputs.image }}
      tags: ${{ steps.metadata.outputs.tags }}
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit already on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install the Linux runtime dependency for Node 26
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libatomic1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - name: Validate release metadata and package versions
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --test scripts/release-metadata.test.mjs
          node --test scripts/release-oci.test.mjs
          node scripts/release-metadata.mjs
      - name: Reject tracked private runtime state
        run: node .github/scripts/check-public-tree.mjs
      - name: Build and test the locked engine
        run: |
          npm --prefix apps/discord-agent ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Keep the pinned Node executable outside the writable hosted tool cache
        run: |
          runtime_dir=$(sudo mktemp -d /tmp/szpont-ci-node-XXXXXX)
          sudo chmod 0755 "$runtime_dir"
          sudo install -m 0755 -o root -g root "$(command -v node)" "$runtime_dir/node"
          cmp "$(command -v node)" "$runtime_dir/node"
          printf '%s\n' "$runtime_dir" >> "$GITHUB_PATH"
      - name: Verify locked provider-tool packages offline
        run: |
          npm ci --prefix packages/mcp-bridge --ignore-scripts --no-audit --no-fund
          npm ci --prefix packages/playwright --ignore-scripts --no-audit --no-fund
          npm test --prefix packages/mcp-bridge
          node --test packages/playwright/*.test.mjs
          sudo "$(command -v node)" --test packages/playwright/runtime.test.mjs
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test the hash-locked browser package offline
        working-directory: packages/browser
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation .
          python -m pytest -q

  smoke:
    name: Offline container smoke / ${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install the Linux runtime dependency for Node 26
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libatomic1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - name: Prepare OCI artifact tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          mkdir -p "$RUNNER_TEMP/release-image" "$RUNNER_TEMP/release-layout"
      - name: Load the container sandbox profile on this ephemeral runner
        run: |
          if docker info --format '{{json .SecurityOptions}}' | grep -q 'name=apparmor'; then
            sudo install -m 0644 scripts/docker-apparmor /etc/apparmor.d/szpont-engine-container
            sudo apparmor_parser -r -W /etc/apparmor.d/szpont-engine-container
            printf 'SZPONT_DOCKER_APPARMOR_PROFILE=szpont-engine-container\n' >> "$GITHUB_ENV"
          fi
      - name: Build the release artifact once without registry credentials
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          platforms: linux/${{ matrix.arch }}
          outputs: type=oci,dest=${{ runner.temp }}/release-image/engine.oci.tar
          tags: ${{ needs.verify.outputs.image }}:sha-${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-smoke-${{ matrix.arch }}
          cache-to: type=gha,scope=release-smoke-${{ matrix.arch }},mode=max
      - name: Load exactly the OCI artifact and verify its runtime identity
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          archive="$RUNNER_TEMP/release-image/engine.oci.tar"
          report="$RUNNER_TEMP/release-image/tested.json"
          tar -xf "$archive" -C "$RUNNER_TEMP/release-layout"
          node scripts/release-oci.mjs inspect "$RUNNER_TEMP/release-layout" "$ARCH" "$GITHUB_SHA" "$VERSION" > "$report"
          skopeo copy --override-arch "$ARCH" "oci-archive:$archive" "docker-archive:$RUNNER_TEMP/runtime.tar:szpont-engine:smoke"
          docker load -i "$RUNNER_TEMP/runtime.tar"
          docker image save szpont-engine:smoke -o "$RUNNER_TEMP/loaded-runtime.tar"
          config_path=$(tar -xOf "$RUNNER_TEMP/loaded-runtime.tar" manifest.json | jq -er 'if length == 1 then .[0].Config else error("Expected one loaded runtime") end')
          actual="sha256:$(tar -xOf "$RUNNER_TEMP/loaded-runtime.tar" "$config_path" | sha256sum | cut -d ' ' -f 1)"
          test "$actual" = "$(jq -r .configDigest "$report")"
          sh scripts/docker-smoke.sh szpont-engine:smoke
          (cd "$RUNNER_TEMP/release-image" && sha256sum engine.oci.tar > engine.oci.tar.sha256)
      - name: Retain only the tested OCI artifact and digest report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/release-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

  publish:
    name: Publish GHCR image
    needs: [verify, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Linux runtime dependency for Node 26
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libatomic1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install artifact transfer tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Download the artifacts from this verified workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tested-image-*
          path: ${{ runner.temp }}/release-images
          digest-mismatch: error
      - name: Authenticate only after verification passes
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote tested bytes and assemble the release index without rebuilding
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
          TAGS: ${{ needs.verify.outputs.tags }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          sources=()
          reports=()
          for arch in amd64 arm64; do
            artifact="$RUNNER_TEMP/release-images/tested-image-$arch"
            (cd "$artifact" && sha256sum --check engine.oci.tar.sha256)
            layout="$RUNNER_TEMP/promote-$arch"
            mkdir -p "$layout"
            tar -xf "$artifact/engine.oci.tar" -C "$layout"
            node scripts/release-oci.mjs inspect "$layout" "$arch" "$GITHUB_SHA" "$VERSION" > "$layout/verified.json"
            cmp "$artifact/tested.json" "$layout/verified.json"
            ref="$IMAGE:sha-$GITHUB_SHA-$arch"
            skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" --digestfile "$layout/published.digest" "oci-archive:$artifact/engine.oci.tar" "docker://$ref"
            expected=$(jq -r .indexDigest "$artifact/tested.json")
            test "$(cat "$layout/published.digest")" = "$expected"
            sources+=("$IMAGE@$expected")
            reports+=("$artifact/tested.json")
          done
          tag_args=()
          IFS=',' read -ra tags <<< "$TAGS"
          for tag in "${tags[@]}"; do tag_args+=(--tag "$tag"); done
          docker buildx imagetools create --dry-run "${sources[@]}" > "$RUNNER_TEMP/release-index.json"
          node scripts/release-oci.mjs verify-index "$RUNNER_TEMP/release-index.json" "${reports[@]}"
          docker buildx imagetools create --metadata-file "$RUNNER_TEMP/release-metadata.json" "${tag_args[@]}" "${sources[@]}"
          DIGEST=$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/release-metadata.json")
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" > "$RUNNER_TEMP/published-index.json"
          node scripts/release-oci.mjs verify-index "$RUNNER_TEMP/published-index.json" "${reports[@]}"
          printf '## Container image\n\n`%s@%s`\n\nPin this digest for repeatable deployments.\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
