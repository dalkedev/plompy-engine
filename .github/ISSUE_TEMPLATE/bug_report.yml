name: Bug report
description: Report a reproducible engine or browser problem.
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic IDs and a minimal reproduction. Do not attach credentials,
        browser profiles, conversation transcripts, raw model events or private workspace files.
        For a security issue, follow [SECURITY.md](https://github.com/dalkedev/szpont-engine/security/policy).
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest safe configuration or test case that shows the problem.
      placeholder: |
        1. Set up a temporary workspace with synthetic IDs.
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the commit, OS, Node version and, for browser issues, Python version.
      placeholder: |
        Commit:
        OS:
        Node:
        Python (if applicable):
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Share a short redacted error or failing test. Inspect every line before posting.
      render: text
