name: szpont-engine
services:
  engine:
    image: ${SZPONT_IMAGE:-ghcr.io/dalkedev/szpont-engine:0.11.0}
    build:
      context: .
    env_file:
      - ${SZPONT_ENV_FILE:?Set SZPONT_ENV_FILE to an absolute private environment file outside this checkout}
    environment:
      # These container paths override host-path values in the private environment file.
      SZPONT_RUNNER: codex
      CODEX_HOME: /var/lib/szpont/codex
      GH_CONFIG_DIR: /var/lib/szpont/github
      SZPONT_WORKSPACE: /var/lib/szpont/workspace/current
      SZPONT_STATE_DIR: /var/lib/szpont/state
      SZPONT_ARTIFACTS_DIR: /var/lib/szpont/artifacts
      SZPONT_BROWSER_DIR: /tmp/szpont-browser
      SZPONT_CODEX_BIN: /usr/local/bin/codex
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./scripts/docker-seccomp.json
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    volumes:
      - workspace:/var/lib/szpont/workspace
      - state:/var/lib/szpont/state
      - artifacts:/var/lib/szpont/artifacts
      - codex-auth:/var/lib/szpont/codex
      - github-auth:/var/lib/szpont/github
    restart: unless-stopped
    stop_grace_period: 30s
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  workspace:
  state:
  artifacts:
  codex-auth:
  github-auth:
