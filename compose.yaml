name: plompy-engine
services:
  engine:
    image: ${PLOMPY_IMAGE:-ghcr.io/dalkedev/plompy-engine:0.12.0}
    build:
      context: .
    env_file:
      - ${PLOMPY_ENV_FILE:-${SZPONT_ENV_FILE:?Set PLOMPY_ENV_FILE to an absolute private environment file outside this checkout}}
    environment:
      # These container paths override host-path values in the private environment file.
      PLOMPY_RUNNER: codex
      CODEX_HOME: /var/lib/plompy/codex
      GH_CONFIG_DIR: /var/lib/plompy/github
      PLOMPY_WORKSPACE: /var/lib/plompy/workspace/current
      PLOMPY_STATE_DIR: /var/lib/plompy/state
      PLOMPY_ARTIFACTS_DIR: /var/lib/plompy/artifacts
      PLOMPY_BROWSER_DIR: /tmp/plompy-browser
      PLOMPY_CODEX_BIN: /usr/local/bin/codex
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./scripts/docker-seccomp.json
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    volumes:
      - workspace:/var/lib/plompy/workspace
      - state:/var/lib/plompy/state
      - artifacts:/var/lib/plompy/artifacts
      - codex-auth:/var/lib/plompy/codex
      - github-auth:/var/lib/plompy/github
    restart: unless-stopped
    stop_grace_period: 30s
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  workspace:
  state:
  artifacts:
  codex-auth:
  github-auth:
